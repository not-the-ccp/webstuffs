<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 340" role="img" aria-label="Mushroom ketchup bottle, brown glass, paper label">
  <g stroke="#2b241c" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- cork and lip -->
    <rect x="62" y="14" width="36" height="16" fill="#a5825a" stroke="#5b3a21"/>
    <path d="M66 30 h28 v10 q0 4 4 6 l0 0 v6 h-36 v-6 q4 -2 4 -6 z" fill="#efe7d8" stroke="#5b3a21"/>
    <!-- neck -->
    <path d="M66 52 c0 14 -10 20 -16 30 c-8 14 -10 26 -10 40" fill="none"/>
    <path d="M94 52 c0 14 10 20 16 30 c8 14 10 26 10 40" fill="none"/>
    <!-- body -->
    <path d="M40 122 h80 v168 q0 14 -14 14 h-52 q-14 0 -14 -14 z" fill="#4a3120" stroke="#2b241c"/>
    <path d="M40 122 v168 q0 14 14 14 h52 q14 0 14 -14 V122" fill="none" opacity="0"/>
    <!-- glass highlight -->
    <path d="M50 136 q-4 60 2 150" stroke="#8a6b4f" stroke-width="3" opacity="0.7"/>
    <!-- label -->
    <rect x="48" y="152" width="64" height="96" fill="#f6f1e7" stroke="#5b3a21" stroke-width="1.5"/>
    <line x1="54" y1="162" x2="106" y2="162" stroke="#5b3a21" stroke-width="1"/>
    <line x1="54" y1="238" x2="106" y2="238" stroke="#5b3a21" stroke-width="1"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#2b241c" text-anchor="middle">
    <text x="80" y="178" font-size="11" letter-spacing="0.5">MUSHROOM</text>
    <text x="80" y="194" font-size="11" letter-spacing="0.5">KETCHUP</text>
    <text x="80" y="212" font-size="7.5" font-style="italic" fill="#6d6254">Fieldhouse Lane,</text>
    <text x="80" y="222" font-size="7.5" font-style="italic" fill="#6d6254">Oldbury, Worcestershire</text>
  </g>
  <!-- wax seal -->
  <circle cx="80" cy="300" r="11" fill="#8a4b2a" stroke="#5b3a21" stroke-width="1.5"/>
  <text x="80" y="304" font-family="Georgia, serif" font-size="10" fill="#f6f1e7" text-anchor="middle">F</text>
</svg>
