<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Figure 2: the base with the runner's lead and the break point">
  <g fill="none" stroke="#3c4a3a" stroke-width="1.4">
    <!-- base -->
    <rect x="96" y="70" width="56" height="40" fill="#f7f3e9"/>
    <!-- base path, gunpowder green chalk -->
    <line x1="10" y1="90" x2="72" y2="90"/>
    <line x1="176" y1="90" x2="310" y2="90"/>
    <!-- lead line from far edge of base to runner's position -->
    <line x1="152" y1="90" x2="238" y2="90" stroke-dasharray="5 4"/>
    <!-- break point -->
    <line x1="238" y1="78" x2="238" y2="102" stroke-width="1.8"/>
    <!-- runner -->
    <circle cx="258" cy="90" r="9"/>
    <path d="M250 96 L238 112 M266 96 L280 110 M258 99 L258 114 M258 114 L248 128 M258 114 L268 128"/>
    <!-- pitcher's direction, dotted release line -->
    <line x1="310" y1="150" x2="196" y2="150" stroke-dasharray="1.5 5"/>
    <circle cx="196" cy="150" r="3" fill="#3c4a3a"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6d675a">
    <text x="96" y="60">base</text>
    <text x="160" y="80">lead</text>
    <text x="216" y="66">break point</text>
    <text x="246" y="66">runner</text>
    <text x="196" y="170">pitcher's release, dotted</text>
    <text x="10" y="112">90 ft.</text>
  </g>
</svg>
