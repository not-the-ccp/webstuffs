<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Seal of the Clairvaux Correspondents' Club: a door with a line through it">
  <circle cx="50" cy="50" r="46" fill="#fbf8f1" stroke="#2b2620" stroke-width="2"/>
  <circle cx="50" cy="50" r="39" fill="none" stroke="#c9c0ae" stroke-width="1.5"/>
  <!-- the door -->
  <rect x="36" y="30" width="28" height="44" fill="none" stroke="#2b2620" stroke-width="2"/>
  <line x1="36" y1="52" x2="64" y2="52" stroke="#2b2620" stroke-width="1.5"/>
  <circle cx="58" cy="46" r="1.8" fill="#2b2620"/>
  <!-- the single red line through it -->
  <line x1="20" y1="62" x2="80" y2="40" stroke="#9e2b25" stroke-width="2.5"/>
  <!-- the step -->
  <line x1="30" y1="74" x2="70" y2="74" stroke="#2b2620" stroke-width="1.5"/>
</svg>
